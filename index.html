<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Physics App Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #137fec;
      --ink: #111827;
      --muted: #5d6878;
      --line: rgba(15, 23, 42, 0.1);
      --surface: rgba(255, 255, 255, 0.88);
      --shadow: 0 20px 48px rgba(19, 127, 236, 0.14);
      color-scheme: light;
      font-family: "Work Sans", "Noto Sans JP", "Open Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 214, 80, 0.3), transparent 22rem),
        linear-gradient(135deg, #f7fbff 0%, #eef8f7 44%, #fff7ec 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;
      overflow-x: hidden;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      color: var(--primary);
    }

    .nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #526173;
    }

    .nav a:hover {
      color: var(--primary);
    }

    .menu-button {
      display: none;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .home-shell {
      display: flex;
      width: min(1180px, 100%);
      min-height: calc(100svh - 64px);
      margin: 0 auto;
      padding: clamp(0.85rem, 2.4svh, 1.75rem) clamp(1rem, 3vw, 2rem);
      flex-direction: column;
      justify-content: center;
      gap: clamp(0.75rem, 1.8svh, 1.1rem);
    }

    .hero-panel {
      min-height: clamp(11.5rem, 34svh, 19.5rem);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 12px;
      background-image:
        linear-gradient(90deg, rgba(255, 255, 255, 0.97) 0%, rgba(255, 255, 255, 0.84) 42%, rgba(255, 255, 255, 0.12) 76%),
        url("./assets/hero-physics-pop.png");
      background-position: center;
      background-size: cover;
      box-shadow: var(--shadow);
    }

    .hero-copy {
      display: flex;
      min-height: inherit;
      max-width: 740px;
      padding: clamp(1.1rem, 3vw, 2.4rem);
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.65rem;
      padding: 0.38rem 0.72rem;
      border: 1px solid #a5f3fc;
      border-radius: 999px;
      background: rgba(207, 250, 254, 0.9);
      color: #155e75;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .eyebrow svg {
      width: 1rem;
      height: 1rem;
    }

    .hero-title {
      max-width: 740px;
      margin: 0;
      font-size: clamp(1.78rem, 5vw, 4.45rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1.02;
    }

    .hero-title span {
      display: block;
      white-space: nowrap;
    }

    .hero-site-title {
      margin: 0 0 0.35rem;
      color: var(--primary);
      font-size: clamp(1.18rem, 2.8vw, 2.35rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .hero-subtitle {
      max-width: 720px;
      margin: 0.82rem 0 0;
      color: var(--muted);
      font-size: clamp(0.88rem, 1.18vw, 1rem);
      font-weight: 700;
      line-height: 1.75;
      white-space: nowrap;
    }

    .category-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .category-head h2 {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.28rem);
      font-weight: 900;
      letter-spacing: 0;
    }

    .all-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.46rem 0.8rem;
      border: 1px solid #dbeafe;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--primary);
      font-size: clamp(0.78rem, 1.8vw, 0.9rem);
      font-weight: 900;
      white-space: nowrap;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(0.6rem, 1.2vw, 0.85rem);
    }

    .category-card {
      display: flex;
      min-height: clamp(4.75rem, 13svh, 8rem);
      align-items: center;
      gap: 0.78rem;
      padding: clamp(0.72rem, 1.5vw, 1rem);
      border: 1px solid var(--tone-line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 3px 14px rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(10px);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .category-card:hover {
      transform: translateY(-3px);
      border-color: var(--tone);
      box-shadow: 0 14px 30px rgba(31, 41, 55, 0.12);
    }

    .icon-box {
      display: grid;
      width: clamp(2.35rem, 4vw, 2.7rem);
      height: clamp(2.35rem, 4vw, 2.7rem);
      flex: 0 0 auto;
      place-items: center;
      border-radius: 10px;
      background: var(--tone-bg);
      color: var(--tone);
    }

    .icon-box svg {
      width: 1.45rem;
      height: 1.45rem;
      stroke: currentColor;
      stroke-width: 2.3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-copy {
      min-width: 0;
    }

    .card-title {
      display: block;
      font-size: clamp(0.9rem, 1.7vw, 1.02rem);
      font-weight: 900;
      line-height: 1.35;
    }

    .card-note {
      display: block;
      overflow: hidden;
      margin-top: 0.2rem;
      color: #667085;
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mechanics {
      --tone: #1d4ed8;
      --tone-bg: #dbeafe;
      --tone-line: #bfdbfe;
    }

    .waves {
      --tone: #0f766e;
      --tone-bg: #ccfbf1;
      --tone-line: #99f6e4;
    }

    .electricity {
      --tone: #7c3aed;
      --tone-bg: #ede9fe;
      --tone-line: #ddd6fe;
    }

    .thermal {
      --tone: #c2410c;
      --tone-bg: #ffedd5;
      --tone-line: #fed7aa;
    }

    .atomic {
      --tone: #be123c;
      --tone-bg: #ffe4e6;
      --tone-line: #fecdd3;
    }

    .news-section {
      background: #fff;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 3vw, 2rem);
    }

    .news-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .news-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.4rem;
    }

    .news-header h2 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 900;
      letter-spacing: 0;
    }

    .news-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .news-card {
      display: flex;
      gap: 0.8rem;
      padding: 1rem;
      border: 1px solid #eef2f7;
      border-radius: 10px;
      background: #f8fafc;
    }

    .news-mark {
      width: 0.62rem;
      height: 0.62rem;
      flex: 0 0 auto;
      margin-top: 0.38rem;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 0.32rem #dbeafe;
    }

    .news-date {
      margin: 0;
      color: #667085;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .news-title {
      margin: 0.28rem 0 0;
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.65;
    }

    @media (max-height: 700px) {
      .home-shell {
        padding-top: 0.65rem;
        padding-bottom: 0.85rem;
      }

      .hero-panel {
        min-height: 9.75rem;
      }

      .category-card {
        min-height: 4.35rem;
      }

      .hero-subtitle {
        margin-top: 0.55rem;
        line-height: 1.55;
      }
    }

    @media (max-width: 760px) {
      .nav {
        display: none;
      }

      .menu-button {
        display: inline-grid;
        place-items: center;
      }

      .menu-button span,
      .menu-button span::before,
      .menu-button span::after {
        display: block;
        width: 18px;
        height: 2px;
        border-radius: 999px;
        background: #374151;
      }

      .menu-button span {
        position: relative;
      }

      .menu-button span::before,
      .menu-button span::after {
        position: absolute;
        left: 0;
        content: "";
      }

      .menu-button span::before {
        top: -6px;
      }

      .menu-button span::after {
        top: 6px;
      }

      .hero-panel {
        min-height: clamp(10rem, 26svh, 14rem);
        background-image:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.86) 56%, rgba(255, 255, 255, 0.16) 100%),
          url("./assets/hero-physics-pop.png");
        background-position: center right;
      }

      .hero-copy {
        padding: 1rem;
      }

      .hero-subtitle {
        white-space: normal;
      }

      .hero-title {
        font-size: clamp(1.52rem, 7.5vw, 1.9rem);
        line-height: 1.08;
      }

      .hero-site-title {
        margin-bottom: 0.28rem;
        font-size: clamp(1.05rem, 5vw, 1.35rem);
      }

      .category-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-card {
        min-height: clamp(4.1rem, 10.2svh, 5rem);
      }

      .atomic {
        grid-column: span 2;
      }

      .news-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .home-shell {
        gap: 0.62rem;
      }

      .eyebrow {
        margin-bottom: 0.45rem;
        padding: 0.28rem 0.58rem;
      }

      .hero-subtitle {
        margin-top: 0.5rem;
        line-height: 1.55;
      }

      .icon-box {
        width: 2.2rem;
        height: 2.2rem;
      }

      .card-note {
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>
<div class="page">
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Physics App Lab ホーム">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 4C25.7818 14.2173 33.7827 22.2182 44 24C33.7827 25.7818 25.7818 33.7827 24 44C22.2182 33.7827 14.2173 25.7818 4 24C14.2173 22.2182 22.2182 14.2173 24 4Z"/>
        </svg>
      </span>
      <span>Physics App Lab</span>
    </a>

    <nav class="nav" aria-label="メインナビゲーション">
      <a href="./index.html">Home</a>
      <a href="./apps.html">Apps</a>
      <a href="./support.html">Support</a>
    </nav>

    <button class="menu-button" type="button" aria-label="メニュー"><span></span></button>
  </header>

  <main>
    <section class="home-shell" aria-labelledby="hero-title">
      <div class="hero-panel">
        <div class="hero-copy">
          <p class="eyebrow">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 2v6.5L4.7 18.1A2.6 2.6 0 0 0 7 22h10a2.6 2.6 0 0 0 2.3-3.9L14 8.5V2"/>
              <path d="M8 2h8"/>
              <path d="M7.5 16h9"/>
            </svg>
            高校物理の実験室
          </p>
          <p class="hero-site-title">Physics App Lab</p>
          <h1 class="hero-title" id="hero-title">
            <span>物理を、さわって</span>
            <span>わかる。</span>
          </h1>
          <p class="hero-subtitle">
            授業ですぐ使える実験アプリとシミュレーションを、5つの分野から選べます。
          </p>
        </div>
      </div>

      <div class="category-head">
        <h2>カテゴリを選ぶ</h2>
        <a class="all-link" href="./apps.html" aria-label="すべてのアプリを見る">すべて見る →</a>
      </div>

      <div class="category-grid" aria-label="物理カテゴリ">
        <a href="./apps.html?subject=力学" class="category-card mechanics">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19c5-8 10-8 16-14"/><path d="M14 5h6v6"/><path d="M6 18h.01"/></svg>
          </span>
          <span class="card-copy">
            <span class="card-title">力学</span>
            <span class="card-note">運動・力・エネルギー</span>
          </span>
        </a>

        <a href="./apps.html?subject=波動" class="category-card waves">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 12c2.5-6 4.5 6 7 0s4.5-6 7 0 4.5 6 7 0"/></svg>
          </span>
          <span class="card-copy">
            <span class="card-title">波動</span>
            <span class="card-note">音・光・干渉</span>
          </span>
        </a>

        <a href="./apps.html?subject=電磁気" class="category-card electricity">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7l0-7z"/></svg>
          </span>
          <span class="card-copy">
            <span class="card-title">電磁気</span>
            <span class="card-note">電場・磁場・回路</span>
          </span>
        </a>

        <a href="./apps.html?subject=熱・気体" class="category-card thermal">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M14 14.8V5a4 4 0 0 0-8 0v9.8a6 6 0 1 0 8 0Z"/><path d="M10 9h4"/></svg>
          </span>
          <span class="card-copy">
            <span class="card-title">熱・気体</span>
            <span class="card-note">温度・気体・熱力学</span>
          </span>
        </a>

        <a href="./apps.html?subject=原子" class="category-card atomic">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.8"/><ellipse cx="12" cy="12" rx="9" ry="3.8"/><ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(120 12 12)"/></svg>
          </span>
          <span class="card-copy">
            <span class="card-title">原子</span>
            <span class="card-note">量子・原子核・半減期</span>
          </span>
        </a>
      </div>
    </section>

    <section class="news-section">
      <div class="news-inner">
        <div class="news-header">
          <h2>最新の更新情報</h2>
          <a class="all-link" href="./apps.html">アプリ一覧へ →</a>
        </div>
        <div class="news-list" id="news-list">
          <!-- JSでnews.jsonから挿入 -->
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  fetch('./data/news.json')
    .then(res => res.json())
    .then(items => {
      const container = document.getElementById('news-list');
      container.innerHTML = '';
      items.slice(0, 6).forEach(item => {
        const card = document.createElement('article');
        card.className = 'news-card';
        card.innerHTML = `
          <span class="news-mark" aria-hidden="true"></span>
          <div>
            <p class="news-date">${item.date}</p>
            <h3 class="news-title">${item.title}</h3>
          </div>
        `;
        container.appendChild(card);
      });
    })
    .catch(err => {
      console.error('news load error', err);
    });
</script>

</body>
</html>
